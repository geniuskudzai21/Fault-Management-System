services:
  - type: web
    name: fault-management-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false